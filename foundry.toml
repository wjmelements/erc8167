[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.36"
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
cbor_metadata = false

# For dependencies
remappings = [
    'forge-std/=lib/forge-std/src/',
]

[lint]

exclude_lints = [
    'calls-loop',
    'custom-errors',
    'encode-packed-collision',
    'inline-assembly',
    'interface-file-naming',
    'interface-naming',
    'internal-function-used-once',
    'literal-instead-of-constant',
    'missing-inheritance',
    'multi-contract-file',
    'reentrancy-events',
    'require-revert-in-loop',
    'todo-comment',
    'uninitialized-local',
    'unsafe-typecast',
    'unused-return',
]
